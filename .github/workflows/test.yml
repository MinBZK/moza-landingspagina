name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Amsterdam

jobs:
  scripts:
    name: Python-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Test moza-weekly scripts
        run: uv run --project scripts/moza-weekly --locked pytest scripts/moza-weekly/tests/ -q

  node:
    name: Node-scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install pandoc (voor ODF-downloads)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Run tests
        run: npm test

      - name: Controleer het toegankelijkheidslabel
        run: npm run check-label

  site:
    name: Site en links
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
      HTMLTEST_VERSION: 0.17.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Render Mermaid SVGs
        run: npm run render-mermaid

      - name: Verify rendered SVGs exist
        run: |
          count=$(find static/images/render -name '*.svg' 2>/dev/null | wc -l)
          echo "Gevonden: ${count} SVG-bestanden"
          if [ "$count" -eq 0 ]; then
            echo "::error::Geen SVGs gegenereerd — controleer render-mermaid script"
            exit 1
          fi

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Install htmltest
        run: |
          curl -sLJO "https://github.com/wjdp/htmltest/releases/download/v${HTMLTEST_VERSION}/htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          mkdir -p "${HOME}/.local/htmltest"
          tar -C "${HOME}/.local/htmltest" -xf "htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          rm "htmltest_${HTMLTEST_VERSION}_linux_amd64.tar.gz"
          echo "${HOME}/.local/htmltest" >> "${GITHUB_PATH}"

      - name: Verify installations
        run: |
          echo "Hugo: $(hugo version)"
          echo "htmltest: $(htmltest --version)"

      - name: Build site
        run: hugo --gc --minify --logLevel warning

      - name: Bouw site voor de controles
        run: hugo --minify --quiet --baseURL / --destination tmp/public

      - name: Deel de gebouwde site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: tmp/public
          retention-days: 1

      - name: Test links
        run: htmltest

  a11y:
    name: Toegankelijkheid
    runs-on: ubuntu-latest
    needs: site
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Haal de gebouwde site op
        uses: actions/download-artifact@v8
        with:
          name: site
          path: tmp/public

      - name: Toets toegankelijkheid (WCAG 2.1 AA)
        run: npm run a11y

  csp:
    name: Content-Security-Policy
    runs-on: ubuntu-latest
    needs: site
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Haal de gebouwde site op
        uses: actions/download-artifact@v8
        with:
          name: site
          path: tmp/public

      # Leest alleen bestanden; node_modules is hier niet nodig.
      - name: Controleer op door de CSP geblokkeerde constructies
        run: npm run csp
