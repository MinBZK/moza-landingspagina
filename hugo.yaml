baseURL: https://mijnoverheidzakelijk.nl/
title: MijnOverheid Zakelijk
defaultContentLanguage: nl

params:
  tagline: Makkelijk zakendoen met de overheid
  description: Bij MijnOverheid Zakelijk staan ondernemers centraal. Elk uur minder aan gedoe, is een uur meer ondernemen. We zorgen voor overzicht en makkelijk zakendoen.
  footer:
    tagline: Eén Overheid. Voor iedereen!
    links: Zie ook
    rechts: Over deze site

disableKinds:
  - taxonomy
  - term

enableRobotsTXT: true
enableGitInfo: true

# Whitelist van toegestane contenttypes. Vanaf Hugo v0.162 blokkeert de
# standaardpolicy text/html. Omdat allowContent een whitelist is die de
# standaard volledig vervangt, moeten alle gebruikte types hier staan:
# markdown voor gewone pagina's, html voor de presentatie-page-bundles.
security:
  allowContent:
    - ^text/markdown$
    - ^text/html$

permalinks:
  page:
    weekly: /weekly/:slug/

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    # De CSP blokkeert inline styles; palet in assets/css/components/code.css.
    noClasses: false
  tableOfContents:
    endLevel: 4

menus:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Over MOZa
      pageRef: /over-moza
      weight: 2
    - name: Actueel
      pageRef: /actueel
      weight: 3
    - name: Onderwerpen
      pageRef: /onderwerpen
      weight: 4
    - name: Contact
      pageRef: /contact
      weight: 5

  handboek_nav:
    - name: MOZa Handboek
      pageRef: /handboek
      weight: 1
      params:
        bold: true
    - name: Jouw start
      pageRef: /handboek/jouw-start
      weight: 2
    - name: Werkwijze
      pageRef: /handboek/werkwijze
      weight: 3
    - name: Over MOZa
      pageRef: /handboek/over-moza
      weight: 4
    - name: Bijdragen
      pageRef: /handboek/bijdragen
      weight: 5

  footer-links:
    - name: Handboek
      pageRef: /handboek
      weight: 1
    - name: GitHub
      url: https://github.com/topics/mijnoverheidzakelijk
      weight: 2

  footer-rechts:
    - name: Privacy
      pageRef: /privacy
      weight: 1
    - name: Toegankelijkheid
      pageRef: /toegankelijkheid
      weight: 2
    - name: Contact
      pageRef: /contact
      weight: 3

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms
    - llmsfull
    - download
  section:
    - HTML
    - RSS
    - llms
    - llmsfull
  page:
    - HTML
    - markdown

outputFormats:
  llms:
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  llmsfull:
    baseName: llms-full
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  llmsrecent:
    baseName: llms-recent-full
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  markdown:
    baseName: index
    mediaType: text/markdown
    isPlainText: true
    notAlternative: true
  # Bron voor de .odt-downloads: gelijk aan markdown, maar met de tabellen die
  # pandoc nodig heeft. Zie layouts/_partials/markdown-body.html.
  pandoc:
    baseName: index.pandoc
    mediaType: text/markdown
    isPlainText: true
    notAlternative: true
  download:
    baseName: download
    mediaType: application/json
    isPlainText: true
    notAlternative: true
