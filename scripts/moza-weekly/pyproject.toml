[project]
name = "moza-weekly"
version = "0.2.0"
description = "Verzamelt Mattermost-input voor de MOZa Weekly en rendert die naar YAML, JSON en HTML"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jinja2>=3",
    "markdown-it-py>=3",
    "pyyaml>=6",
    "tenacity>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
# Alleen voor `just moza-weekly-namencheck`. Het taalmodel is ruim 500 MB, dus
# bewust buiten de gewone pipeline en buiten CI gehouden.
ner = [
    "spacy>=3.8",
    "nl_core_news_lg",
]

[tool.uv.sources]
nl_core_news_lg = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl" }

[tool.uv]
package = false
