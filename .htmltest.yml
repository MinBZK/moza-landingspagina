DirectoryPath: tmp/public

# htmltest kent geen retry: één trage server is meteen een rode build.
ExternalTimeout: 30
HTTPConcurrencyLimit: 4

IgnoreAltEmpty: true

IgnoreURLs:
  - samenwerkruimten.nl
  - figma.com
  - norstat.co
  - commonground.nl
  - github.com/MinBZK/moza-mcp-standaard-poc
  - claude.ai
  - medium.com
  - fieldlab.bzlg.apps.digilab.network
  - styledictionary.com
  - smashingmagazine.com
  - code.overheid.nl
  - realisatieibds.pleio.nl
  - docs.rijksapp.nl
  - fmis.belastingdienst.nl
  # GitHub blokkeert geautomatiseerde requests (403), ook naar publieke pagina's
  - github.com/signup
  # tweedekamer.nl geeft 404 op het verzoek van htmltest; met curl (ook HEAD) en
  # in de browser geeft dezelfde URL gewoon 200.
  - tweedekamer.nl
  # Deze twee geven vanaf de CI-runner met tussenpozen 403, terwijl dezelfde
  # URL's lokaal en in de browser 200 geven. Drie builds op rij zijn erop
  # gestrand zonder dat er iets aan de links mankeerde.
  - zoek.officielebekendmakingen.nl
  - wetten.overheid.nl
  # Downloadbestanden (.odt/.pdf) worden ná de Hugo-build gegenereerd
  # (pandoc/Chromium) en bestaan dus niet in de kale build die htmltest checkt.
  - \.odt$
  - \.pdf$
