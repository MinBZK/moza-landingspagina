{{- /* Volledige page chrome voor een rapportage. Alles via externe <link>/<script>
   zodat strikte CSP (geen inline style/script) werkt — net als presentaties. */ -}}
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} | {{ .Site.Title }}</title>
{{- /* Zonder deze regel worden de woff2's niet gepubliceerd. */ -}}
{{- range (resources.Match "vendor/inter/*.woff2") -}}{{- $_ := .RelPermalink -}}{{- end }}
{{- /* inter.css verwijst relatief naar zijn fonts; in een bundel op een ander
       pad kloppen die paden niet meer. */ -}}
{{- $inter := resources.Get "vendor/inter/inter.css" -}}
{{- $interAbs := resources.FromString "css/inter-absoluut.css"
      (replaceRE `url\("` (printf `url("%s` (relURL "vendor/inter/")) $inter.Content) -}}
{{- $css := slice $interAbs (resources.Get "css/rapportages.css") (resources.Get "css/rapportage-nav.css")
      | resources.Concat "css/rapportage-bundle.css" | fingerprint "md5" }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
{{ .Content }}
<button id="moza-nav" class="moza-nav" type="button">&larr; Terug</button>
{{- with resources.Get "js/rapportage-nav.js" }}
<script src="{{ .RelPermalink }}"></script>
{{- end }}
</body>
</html>
