{{- /* Volledige page chrome voor een rapportage. Alles via externe <link>/<script>
   zodat strikte CSP (geen inline style/script) werkt — net als presentaties. */ -}}
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Title }} · {{ .Site.Title }}</title>
{{- /* fonts.css bevat relURL-aanroepen en moet daarom als template worden uitgevoerd. */ -}}
{{- $fonts := resources.Get "css/fonts.css" | resources.ExecuteAsTemplate "css/rapportage-fonts.css" . -}}
{{- $css := slice $fonts (resources.Get "css/nldd-primitives.css") (resources.Get "css/tokens.css") (resources.Get "css/rapportages.css") (resources.Get "css/rapportage-nav.css")
      | resources.Concat "css/rapportage-bundle.css" | fingerprint "md5" }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{- /* Zelfde thema-keuze als op de rest van de site (data-scheme uit localStorage). */ -}}
{{- with resources.Get "js/theme-init.js" }}
<script src="{{ .RelPermalink }}"></script>
{{- end }}
</head>
<body>
{{ .Content }}
<button id="moza-nav" class="moza-nav" type="button">&larr; Terug</button>
{{- with resources.Get "js/rapportage-nav.js" }}
<script src="{{ .RelPermalink }}"></script>
{{- end }}
</body>
</html>
